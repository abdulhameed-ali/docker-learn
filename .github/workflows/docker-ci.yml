name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # الصلاحيات اللازمة لرفع الصور إلى مستودع GitHub الحزم
    permissions:
      contents: read
      packages: write

    steps:
      # 1. نسخ الكود من المستودع إلى خادم جيت هاب الافتراضي
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد أداة بناء دوكر المتطورة Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. تسجيل الدخول الآمن إلى GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. بناء الصورة المخصصة من الـ Dockerfile ورفعها تلقائياً بالاسم الجديد
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docker-learn-app:latest
